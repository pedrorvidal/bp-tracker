# Weekly dependency updates. Minor and patch updates are grouped into one
# pull request per ecosystem to keep the noise down; major updates get their
# own. Security updates are opened as soon as an advisory is published
# (enable "Dependabot security updates" in the repository settings).
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - backend
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - frontend
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
